name: Release

on:
  push:
    branches:
      - main
      - develop
      - alpha

permissions:
  contents: read # for checkout

# semantic-release tags, pushes and publishes. Two of these running at once —
# which is what merging a second PR before the first release finishes gives you
# — race on all three, and one of them loses. Serialize per branch.
#
# cancel-in-progress stays false on purpose: a queued release must still run
# after the one ahead of it, or the commits merged second never get published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Pin >= 22.14.0 to satisfy semantic-release@25 / @semantic-release/npm@13 engines
          node-version: '22.14.0'
          cache: 'npm'

      # npm >= 11.5.1 is required for OIDC trusted publishing. Pin to 11.x so a
      # future npm major (which may require newer Node) can't break the job.
      - name: Upgrade npm
        run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: npm ci

      # The attestation half of this check pulls TUF metadata from
      # tuf-repo-cdn.sigstore.dev. That CDN intermittently returns an HTTP
      # error ("npm error Failed to download"), which failed the whole release.
      # Retry before treating it as a real verification failure.
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit signatures; then
              exit 0
            fi
            echo "npm audit signatures failed (attempt $attempt of 3)" >&2
            sleep 20
          done
          exit 1

      # E2E is gated on PRs by ci.yml; release only needs unit tests
      - name: Run unit tests
        run: npm run test:unit

      - name: Build library
        run: npm run build

      - name: Build with Rollup
        run: npm run build:rollup

      # No NPM_TOKEN: npm publish authenticates via OIDC trusted publishing.
      # Provenance is generated automatically. Requires id-token: write (above).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
