name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

      - name: Check Prettier formatting
        run: npm run format:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs WITH coverage so the thresholds in vitest.config.ts actually gate
      # the build. This job previously ran `test:unit` (no coverage) and then
      # uploaded ./coverage/lcov.info — a file nothing ever generated. Codecov
      # defaults `fail_ci_if_error` to false, so the upload of a missing file
      # logged an error and still exited 0: green CI, zero coverage signal.
      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      # The real coverage gate is the step above: vitest.config.ts thresholds
      # now fail `test:unit:coverage` on their own. Codecov is reporting on
      # top of that, so it must not be able to redden a build the code passed.
      # `fail_ci_if_error` is therefore tied to the token actually existing —
      # loud when the upload can work, skipped when it can't. (This repo has
      # no CODECOV_TOKEN today; hardcoding `true` fails every run.)
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  accessibility:
    # Hard gate: every page in the curated examples site + the dev
    # playground must pass axe-core WCAG 2.1 A + AA. Spec lives in
    # tests/e2e/accessibility-audit.spec.ts. (issue #40)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility audit
        run: CI=1 npx playwright test --project=chromium tests/e2e/accessibility-audit.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-accessibility
          path: playwright-report/
          retention-days: 30

  e2e-tests-linux:
    # Cross-browser matrix on GitHub-hosted Linux (issue #38): every PR
    # exercises all three engines. Ubuntu minutes bill at 1x and the
    # per-engine run is only a couple of minutes, so the three run as
    # parallel jobs rather than sharded within one job.
    #
    # `fail-fast: false` is deliberate: a WebKit-only failure must not
    # cancel the Firefox job, or per-browser triage has nothing to triage.
    #
    # Mobile emulation projects ("Mobile Chrome" / "Mobile Safari") stay on
    # the Windows/macOS jobs below, which run the full 5-project matrix.
    name: e2e-tests-linux (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Install only the engine this job runs — downloading all three per
      # job would triple the setup cost for no added coverage.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests (${{ matrix.browser }})
        run: npm run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-linux-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  e2e-tests-hosted-windows:
    # GitHub-hosted Windows running the full 5-project Playwright matrix
    # on every PR.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-hosted-windows
          path: playwright-report/
          retention-days: 30

  e2e-tests-hosted-macos:
    # GitHub-hosted macOS runs the full 5-project matrix on push to main
    # (and other configured push branches) but NOT on pull_request events.
    # macOS minutes count at 10x on the OSS quota, so per-PR runs were
    # burning ~90 minutes apiece; running post-merge keeps regression
    # signal without the per-PR cost.
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-hosted-macos
          path: playwright-report/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build with Rollup
        run: npm run build:rollup

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  bundle-size:
    # Enforces a gzipped bundle budget so refactors can't silently bloat
    # the library. Budgets live in package.json under "size-limit".
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Check bundle size against budget
        run: npm run size

  # Node-version compatibility, not OS coverage — the name is historical.
  # Cross-OS browser testing lives in the e2e-tests-hosted-* jobs above.
  # (Dropped an `exclude:` block here that filtered on `self-hosted-macos` /
  # `self-hosted-windows`; neither value has ever been in the `os` matrix, so
  # both entries were no-ops implying coverage that wasn't happening.)
  node-version-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build library
        run: npm run build
