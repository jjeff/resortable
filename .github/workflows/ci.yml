name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

      - name: Check Prettier formatting
        run: npm run format:check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs WITH coverage so the thresholds in vitest.config.ts actually gate
      # the build. This job previously ran `test:unit` (no coverage) and then
      # uploaded ./coverage/lcov.info — a file nothing ever generated. Codecov
      # defaults `fail_ci_if_error` to false, so the upload of a missing file
      # logged an error and still exited 0: green CI, zero coverage signal.
      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      # The real coverage gate is the step above: vitest.config.ts thresholds
      # now fail `test:unit:coverage` on their own. Codecov is reporting on
      # top of that, so it must not be able to redden a build the code passed.
      # `fail_ci_if_error` is therefore tied to the token actually existing —
      # loud when the upload can work, skipped when it can't. (This repo has
      # no CODECOV_TOKEN today; hardcoding `true` fails every run.)
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  accessibility:
    # Hard gate: every page in the curated examples site + the dev
    # playground must pass axe-core WCAG 2.1 A + AA. Spec lives in
    # tests/e2e/accessibility-audit.spec.ts. (issue #40)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility audit
        run: CI=1 npx playwright test --project=chromium tests/e2e/accessibility-audit.spec.ts

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-accessibility
          path: playwright-report/
          retention-days: 30

  e2e-tests-linux:
    # Cross-browser matrix on GitHub-hosted Linux (issue #38): every PR
    # exercises all three engines. Ubuntu minutes bill at 1x and the
    # per-engine run is only a couple of minutes, so the three run as
    # parallel jobs rather than sharded within one job.
    #
    # `fail-fast: false` is deliberate: a WebKit-only failure must not
    # cancel the Firefox job, or per-browser triage has nothing to triage.
    #
    # Mobile emulation projects ("Mobile Chrome" / "Mobile Safari") stay on
    # the Windows/macOS jobs below, which run the full 5-project matrix.
    name: e2e-tests-linux (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            run: npm run test:e2e -- --project=chromium
          - browser: firefox
            run: npm run test:e2e -- --project=firefox
          # WebKit runs headed against an Xvfb display, unlike the other two.
          #
          # Headless WebKit on Linux has no compositor and therefore no real
          # frame clock: `requestAnimationFrame` fires ~1.2x/sec, where
          # headless Chromium still drives frames at ~60x/sec. (Measured in
          # mcr.microsoft.com/playwright:v1.58.2-noble.) Everything driven by
          # a rAF loop then runs ~50x slow. AutoScrollPlugin advances the
          # scroll once per frame, so the ~1000px scroll in
          # autoscroll-drop-target.spec.ts takes the better part of a minute
          # and cannot pass under any sane timeout. It is a headless-
          # environment artifact, not a library bug: real WebKit users have a
          # compositor.
          #
          # `xvfb-run` gives WebKit a real display, which restores the frame
          # clock (~36 rAF/sec measured) — and makes the leg FASTER overall,
          # 5.6m to 3.4m, since rAF-driven waits stop crawling. Chromium and
          # Firefox headless already have a working clock, so they stay
          # headless; headed would buy them nothing.
          - browser: webkit
            run: xvfb-run -a npm run test:e2e -- --project=webkit --headed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Install only the engine this job runs — downloading all three per
      # job would triple the setup cost for no added coverage.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests (${{ matrix.browser }})
        run: ${{ matrix.run }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-linux-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  e2e-tests-hosted-windows:
    # GitHub-hosted Windows running the full 5-project Playwright matrix
    # on every PR.
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-hosted-windows
          path: playwright-report/
          retention-days: 30

  e2e-tests-hosted-macos:
    # GitHub-hosted macOS running the full 5-project Playwright matrix on
    # every PR. This is the only leg that exercises Apple's WebKit build —
    # the Linux webkit leg runs the Playwright-bundled WebKit, which differs
    # in exactly the areas this library lives in (pointer/drag event order,
    # compositing, momentum scroll).
    #
    # This job was previously push-only, justified by "macOS minutes count at
    # 10x on the OSS quota". That premise doesn't hold: Actions is free and
    # unmetered on standard GitHub-hosted runners for PUBLIC repos, macOS
    # included, so the 10x multiplier bills against nothing. The real cost is
    # wall clock, and it's small — macOS runs 21m in parallel with the 19m
    # Windows job, so per-PR latency grows by ~2m, not 21m.
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-hosted-macos
          path: playwright-report/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build with Rollup
        run: npm run build:rollup

      # The published artifact is the one thing no other job loads: unit and
      # e2e run against src/, and bundle-size only weighs the bundles. 3.0.0
      # shipped with its React subpath types pointing at a file the build no
      # longer produced, and every check here was green.
      - name: Verify package exports resolve
        run: npm run check:exports

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  bundle-size:
    # Enforces a gzipped bundle budget so refactors can't silently bloat
    # the library. Budgets live in package.json under "size-limit".
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Check bundle size against budget
        run: npm run size

  ci-ok:
    # The single required status check for `main`.
    #
    # Branch rulesets match required checks by literal job name, which makes
    # naming individual jobs there brittle in both directions. Renaming a job
    # strands the old name as "expected, never reported" and deadlocks every
    # PR — #143 renamed `e2e-tests-linux` to three per-engine names and would
    # have done exactly that. Deleting a required job fails the other way,
    # silently: the ruleset still lists it, the settings UI still looks
    # strict, and nothing is enforced.
    #
    # Requiring only this job removes both failure modes. Legs can be added,
    # renamed, or sharded freely; the only edit is to `needs` below.
    needs:
      - lint-and-typecheck
      - unit-tests
      - accessibility
      - e2e-tests-linux
      - e2e-tests-hosted-windows
      - e2e-tests-hosted-macos
      - build
      - bundle-size
      - node-version-test
    # `always()` is load-bearing. Without it this job is SKIPPED when any
    # dependency fails, and a skipped required check does not block a merge —
    # the ruleset would read as satisfied on exactly the runs it must stop.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `needs.*.result` is one of success | failure | cancelled | skipped.
      # 'skipped' is deliberately tolerated: matrix legs and conditional jobs
      # can legitimately skip, and treating that as failure would block PRs
      # for non-failures.
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more required jobs failed or were cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1

  # Node-version compatibility, not OS coverage — the name is historical.
  # Cross-OS browser testing lives in the e2e-tests-hosted-* jobs above.
  # (Dropped an `exclude:` block here that filtered on `self-hosted-macos` /
  # `self-hosted-windows`; neither value has ever been in the `os` matrix, so
  # both entries were no-ops implying coverage that wasn't happening.)
  node-version-test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Build library
        run: npm run build
